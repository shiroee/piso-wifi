<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:"DejaVu Sans",system-ui,sans-serif;background:#F4F5F8;color:#15192B;width:360px;height:760px}
.bar{display:flex;justify-content:space-between;padding:10px 18px 6px;font-size:13px;color:#444}
h1{font-size:26px;margin:18px 20px 14px;font-weight:600}
.toggle{display:flex;justify-content:space-between;align-items:center;margin:0 14px 16px;padding:14px 18px;background:#fff;border-radius:20px;font-size:16px;font-weight:600}
.sw{width:44px;height:26px;border-radius:13px;background:#3B6FE0;position:relative}.sw::after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.label{font-size:13px;color:#667;margin:6px 26px 8px}
.list{margin:0 14px;background:#fff;border-radius:20px;overflow:hidden}
.net{display:flex;align-items:center;gap:14px;padding:15px 18px;border-top:1px solid #EEF0F4;font-size:16px}
.net:first-child{border-top:0}
.net svg{width:24px;height:24px;flex:none;fill:none;stroke:#2A3150;stroke-width:2;stroke-linecap:round}
.net .name{flex:1}.net small{display:block;color:#778;font-size:12.5px;margin-top:2px}
.lock{width:16px;height:16px;stroke:#99A;fill:none;stroke-width:2}
.net.pick{background:#FFF6DD}
</style></head><body>
<div class="bar"><span>9:41</span><span>●●● ▮</span></div>
<h1>Wi-Fi</h1>
<div class="toggle">Use Wi-Fi<span class="sw"></span></div>
<p class="label">Available networks</p>
<div class="list">
  <div class="net pick" id="piso"><svg viewBox="0 0 24 24"><path d="M2.5 8.8a14 14 0 0 1 19 0M5.8 12.3a9.2 9.2 0 0 1 12.4 0M9.1 15.7a4.5 4.5 0 0 1 5.8 0"/><circle cx="12" cy="19.2" r="1.3" fill="#2A3150" stroke="none"/></svg><span class="name"><b>__SSID__</b><small>Open network</small></span></div>
  <div class="net"><svg viewBox="0 0 24 24"><path d="M2.5 8.8a14 14 0 0 1 19 0M5.8 12.3a9.2 9.2 0 0 1 12.4 0M9.1 15.7a4.5 4.5 0 0 1 5.8 0"/><circle cx="12" cy="19.2" r="1.3" fill="#2A3150" stroke="none"/></svg><span class="name">HomeNet_2G<small>Secured</small></span><svg class="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
  <div class="net"><svg viewBox="0 0 24 24"><path d="M5.8 12.3a9.2 9.2 0 0 1 12.4 0M9.1 15.7a4.5 4.5 0 0 1 5.8 0"/><circle cx="12" cy="19.2" r="1.3" fill="#2A3150" stroke="none"/></svg><span class="name">Neighbor-5G<small>Secured</small></span><svg class="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
</div>
</body></html>
